<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云枢观象｜出生数字计算器</title>
<style>
:root{
  color-scheme: light;
  --bg-color: #f7f6f9;
  --card-bg: #ffffff;
  --text-primary: #1e1b29;
  --text-secondary: #746d84;
  --text-muted: #9e96ad;
  --border-color: #eeeaf3;
  --border-focus: #7c5cbf;
  --accent: #7c5cbf;
  --accent-hover: #6a4da9;
  --accent-soft: #f4f0fb;
  --arrow-color: #8c829e;
  --radius-card: 24px;
  --radius-element: 14px;
  --shadow-card: 0 12px 40px -12px rgba(80, 50, 120, 0.05), 0 1px 3px rgba(0, 0, 0, 0.01);
  --shadow-btn: 0 4px 16px -4px rgba(124, 92, 191, 0.35);
}

*{box-sizing: border-box}
body{
  margin: 0;
  background: var(--bg-color);
  color: var(--text-primary);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

main{
  max-width: 680px;
  margin: 0 auto;
  padding: 48px 20px 64px;
}

header{
  margin-bottom: 32px;
  text-align: center;
}

h1{
  font-size: 28px;
  letter-spacing: 0.08em;
  margin: 0 0 8px;
  color: var(--text-primary);
  font-weight: 600;
}

.subtitle{
  font-size: 13px;
  color: var(--text-muted);
  margin: 0;
  letter-spacing: 0.04em;
}

.panel{
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-card);
  padding: 32px 28px;
  margin: 20px 0;
  box-shadow: var(--shadow-card);
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.form-group {
  margin-bottom: 20px;
}
.form-group:last-of-type {
  margin-bottom: 0;
}

label{
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 8px;
  letter-spacing: 0.02em;
}

input, select{
  width: 100%;
  padding: 14px 16px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-element);
  background-color: #faf9fc;
  color: var(--text-primary);
  font: inherit;
  font-size: 14px;
  min-height: 50px;
  transition: all 0.25s ease;
}

select{
  -webkit-appearance: menulist;
  appearance: menulist;
  cursor: pointer;
  touch-action: manipulation;
}

input:hover, select:hover{
  border-color: #d6ccdf;
  background-color: #fff;
}

input:focus, select:focus{
  outline: none;
  background-color: #fff;
  border-color: var(--border-focus);
  box-shadow: 0 0 0 4px rgba(124, 92, 191, 0.08);
}

.grid{
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

button{
  border: 0;
  border-radius: var(--radius-element);
  padding: 16px 24px;
  background: var(--accent);
  color: #fff;
  font: 600 15px inherit;
  cursor: pointer;
  width: 100%;
  margin-top: 24px;
  box-shadow: var(--shadow-btn);
  transition: all 0.25s ease;
  letter-spacing: 0.04em;
}

button:hover{
  background: var(--accent-hover);
  transform: translateY(-1px);
  box-shadow: 0 6px 20px -4px rgba(124, 92, 191, 0.45);
}

button:active{
  transform: translateY(0);
}

.error{
  color: #d6455d;
  font-size: 13px;
  margin-top: 14px;
  padding: 12px 16px;
  background: #fdf2f4;
  border-radius: 10px;
  display: none;
}

/* 结果展示头部 */
.result-head{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border-color);
}

.result-head-left{
  display: flex;
  align-items: center;
  gap: 12px;
}

.result-head h2{
  font-size: 17px;
  margin: 0;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: 0.02em;
}

.pill{
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 6px 14px;
  border-radius: 20px;
}

.user-badge{
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 6px 14px;
  border-radius: 20px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* 表格样式：极紧凑行间距 + 加粗数字 */
table{
  width: auto;
  max-width: 100%;
  margin: 0 auto;
  border-collapse: collapse;
  table-layout: auto;
}

td{
  height: 23px;
  min-width: 1.25em;
  padding: 0 3px;
  text-align: center;
  vertical-align: middle;
  background: transparent;
  border: 0;
  font-size: 22px;
  line-height: 1;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

td.blank{background: transparent}
td.digit{background: transparent}

/* 超大开口角度宽角指向符号 */
td.arrow{
  min-width: 2.6em;
  padding: 0 5px;
  color: var(--arrow-color);
  vertical-align: middle;
}

.arrow-icon{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 28px;
}

.arrow-icon svg{
  width: 34px;
  height: 28px;
  display: block;
}

/* E列高亮底色：高级柔和灰紫色半透明 */
td.e-highlight{
  background: rgba(140, 130, 158, 0.14);
  border-radius: 7px;
  min-width: 1.45em;
  padding: 0 5px;
}

/* 翻页栏 */
.year-nav{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid var(--border-color);
}

.nav-btn{
  margin-top: 0;
  width: auto;
  flex: 1;
  padding: 12px 16px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
  border: 1px solid rgba(124, 92, 191, 0.12);
  border-radius: var(--radius-element);
  box-shadow: none;
}

.nav-btn:hover:not(:disabled){
  background: #ece3f8;
  transform: none;
  box-shadow: none;
}

.nav-btn:disabled{
  opacity: 0.35;
  cursor: not-allowed;
}

.nav-year-info{
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  text-align: center;
  min-width: 104px;
}

/* 返回按钮 */
.back-row{
  margin-bottom: 16px;
}

.back-btn{
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
  width: auto;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 500;
  margin-top: 0;
  border-radius: 10px;
  box-shadow: none;
}

.back-btn:hover{
  background: var(--accent-soft);
  color: var(--accent);
  border-color: rgba(124, 92, 191, 0.2);
  transform: none;
  box-shadow: none;
}

.small{
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 18px;
  text-align: center;
  letter-spacing: 0.02em;
}

.hidden{display: none}

@media(max-width: 520px){
  main{padding: 24px 16px 48px}
  .panel{padding: 24px 20px; border-radius: 20px}
  .grid{gap: 12px}
  td{height: 21px; font-size: 20px; min-width: 1.05em}
  td.arrow{min-width: 2.1em; padding: 0 3px}
  .arrow-icon, .arrow-icon svg{width: 30px; height: 24px}
}
</style>
</head>
<body>
<main>
<header>
  <h1>云枢观象</h1>
  <p class="subtitle">遥夏制作，仅供内部试用~</p>
</header>

<!-- 输入表单页面 -->
<section id="inputPanel" class="panel">
<div class="grid form-group">
  <div>
    <label for="userName">姓名（选填）</label>
    <input id="userName" type="text" placeholder="请输入姓名">
  </div>
  <div>
    <label for="userGender">性别（选填）</label>
    <select id="userGender">
      <option value="" selected disabled hidden>请选择性别</option>
      <option value="male">男</option>
      <option value="female">女</option>
    </select>
  </div>
</div>

<div class="grid form-group">
  <div>
    <label for="calendar">出生日期类型</label>
    <select id="calendar">
      <option value="" selected disabled hidden>请选择日期类型</option>
      <option value="solar">阳历</option>
      <option value="lunar">阴历</option>
    </select>
  </div>
  <div>
    <label for="hour">出生时间</label>
    <select id="hour">
      <option value="" selected disabled hidden>请选择出生时间</option>
      <option value="0">00:00</option>
      <option value="1">01:00</option>
      <option value="2">02:00</option>
      <option value="3">03:00</option>
      <option value="4">04:00</option>
      <option value="5">05:00</option>
      <option value="6">06:00</option>
      <option value="7">07:00</option>
      <option value="8">08:00</option>
      <option value="9">09:00</option>
      <option value="10">10:00</option>
      <option value="11">11:00</option>
      <option value="12">12:00</option>
      <option value="13">13:00</option>
      <option value="14">14:00</option>
      <option value="15">15:00</option>
      <option value="16">16:00</option>
      <option value="17">17:00</option>
      <option value="18">18:00</option>
      <option value="19">19:00</option>
      <option value="20">20:00</option>
      <option value="21">21:00</option>
      <option value="22">22:00</option>
      <option value="23">23:00</option>
    </select>
  </div>
</div>

<div class="form-group" style="margin-top: 20px;">
  <label for="birthDate">出生日期</label>
  <input id="birthDate" type="date">
</div>

<button id="calculate">计算</button>
<div id="error" class="error"></div>
</section>

<!-- 结果展示页面 -->
<section id="outputPanel" class="panel hidden">
<div class="back-row">
  <button type="button" class="back-btn" id="backBtn">← 返回修改</button>
</div>
<div class="result-head">
  <div class="result-head-left">
    <h2>计算结果</h2>
    <div id="userBadgeContainer"></div>
  </div>
  <span class="pill" id="ageLabel"></span>
</div>
<table aria-label="出生数字结果">
<tbody id="numbers"></tbody>
</table>

<div class="year-nav">
  <button type="button" class="nav-btn" id="prevYear">← 前一年</button>
  <span class="nav-year-info" id="targetYearLabel"></span>
  <button type="button" class="nav-btn" id="nextYear">后一年 →</button>
</div>

<p class="small" id="dateLabel"></p>
</section>
</main>

<script>
const $ = id => document.getElementById(id);

// 页面加载时自动将“出生日期”设为当天日期
window.addEventListener('DOMContentLoaded', () => {
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  $('birthDate').value = `${yyyy}-${mm}-${dd}`;
});

// 本地内置农历年表（1900—2099）
const LUNAR_INFO = [0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,
0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x05ac0,0x0ab60,0x096d5,0x092e0,
0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,
0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,
0x092e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,
0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,
0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,
0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252];

const LUNAR_BASE_UTC = Date.UTC(1900, 0, 31);
function leapMonthOf(y) { return LUNAR_INFO[y - 1900] & 0xf; }
function leapDaysOf(y) {
  return leapMonthOf(y) ? ((LUNAR_INFO[y - 1900] & 0x10000) ? 30 : 29) : 0;
}
function lunarMonthDays(y, m) {
  return (LUNAR_INFO[y - 1900] & (0x10000 >> m)) ? 30 : 29;
}
function lunarYearDays(y) {
  let sum = 348;
  const info = LUNAR_INFO[y - 1900];
  for (let bit = 0x8000; bit > 0x8; bit >>= 1) if (info & bit) sum++;
  return sum + leapDaysOf(y);
}
function solarToLunar(iso) {
  const [sy, sm, sd] = iso.split('-').map(Number);
  let offset = Math.floor((Date.UTC(sy, sm - 1, sd) - LUNAR_BASE_UTC) / 86400000);
  if (offset < 0) throw new Error('支持 1900 年 1 月 31 日之后的日期。');
  let y = 1900;
  while (y <= 2099) {
    const days = lunarYearDays(y);
    if (offset < days) break;
    offset -= days;
    y++;
  }
  if (y > 2099) throw new Error('支持至 2099 年。');
  const leap = leapMonthOf(y);
  let m = 1, isLeap = false, monthDays = 0;
  while (m <= 12) {
    if (leap && m === leap + 1 && !isLeap) {
      m--;
      isLeap = true;
      monthDays = leapDaysOf(y);
    } else {
      monthDays = lunarMonthDays(y, m);
    }
    if (offset < monthDays) break;
    offset -= monthDays;
    if (isLeap) isLeap = false;
    else m++;
  }
  return { year: y, month: m, day: offset + 1, isLeapMonth: isLeap };
}
function lunarToday() {
  const now = new Date();
  const iso = [now.getFullYear(), String(now.getMonth()+1).padStart(2,'0'), String(now.getDate()).padStart(2,'0')].join('-');
  return solarToLunar(iso);
}
function virtualAge(y, m, d) {
  const now = lunarToday();
  let age = now.year - y + 1;
  if (now.month < m || (now.month === m && now.day < d)) age--;
  return age;
}
function splitRight(n){
 const s=String(Math.abs(n));
 if(s.length>=3)return s.slice(-3).split('').map(Number);
 if(s.length===2)return [null,...s.split('').map(Number)];
 return [null,null,Number(s)];
}
function reduceSpecial(n){
 let v=Math.abs(n);
 while(v>9){
   if(v===11)return 1;
   v=String(v).split('').reduce((a,b)=>a+Number(b),0);
 }
 return v;
}
function calc(age,month,day,hour){
 const rows=Array.from({length:11},()=>Array(5).fill(null));
 const set=(r,vals)=>{const a=splitRight(vals);a.forEach((v,i)=>rows[r-1][i]=v)};
 set(1,age);set(3,month);set(5,day);
 const sum7=age+month+day;set(7,sum7);
 const hour12=hour%12===0?12:hour%12;
 const hourDigits=splitRight(hour12);hourDigits.forEach((v,i)=>rows[8][i]=v);
 const sum11=sum7+hour12;set(11,sum11);
 for(const r of [2,4,6,8,10]){
   const upper=rows[r-2][2],lower=rows[r][2];
   rows[r-1][3]=reduceSpecial((upper||0)+(lower||0));
 }
 for(const r of [1,3,5,7,9,11]){
   const vals=rows[r-1].slice(0,3).filter(v=>v!==null);
   rows[r-1][4]=reduceSpecial(vals.reduce((a,b)=>a+b,0));
 }
 return rows;
}
function show(rows){
 const body=$('numbers');body.innerHTML='';
 const digitColors={
   1:'#e0a800',6:'#e0a800',
   2:'#289c56',7:'#289c56',
   3:'#118fc2',8:'#118fc2',
   4:'#d63b52',9:'#d63b52',
   5:'#7d6f54',0:'#2c2838'
 };
 const widerArrowSVG = `<span class="arrow-icon" aria-hidden="true"><svg viewBox="0 0 34 28" fill="none"><path d="M1 0.5L32 14L1 27.5" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;

 rows.forEach((r,i)=>{
  const tr=document.createElement('tr');
  r.slice(0,3).forEach(v=>{
    const td=document.createElement('td');
    if(v===null){td.className='blank';td.textContent='';}
    else{td.className='digit';td.textContent=v;td.style.color=digitColors[v];}
    tr.append(td);
  });
  const arrow=document.createElement('td');
  arrow.className='arrow';
  if([1,3,5,7,9].includes(i)){
    arrow.innerHTML=widerArrowSVG;
  }
  tr.append(arrow);
  r.slice(3,5).forEach((v,colIdx)=>{
    const td=document.createElement('td');
    if(v===null){td.className='blank';td.textContent='';}
    else{
      td.className='digit';
      td.textContent=v;
      td.style.color=digitColors[v];
      if(colIdx===1 && (i===0 || i===6 || i===10)){
        td.classList.add('e-highlight');
      }
    }
    tr.append(td);
  });
  body.append(tr);
 });
}

let currentState = null;

function renderState() {
  if (!currentState) return;
  const { birth, hour, baseAge, yearOffset, calendarType, rawDate, userName, userGender } = currentState;
  const activeAge = baseAge + yearOffset;
  const rows = calc(activeAge, birth.month, birth.day, hour);
  show(rows);

  $('ageLabel').textContent = '虚岁 ' + activeAge + ' 岁';
  const targetYear = birth.year + activeAge - 1;
  $('targetYearLabel').textContent = targetYear + ' 年' + (yearOffset === 0 ? '（今年）' : '');
  $('prevYear').disabled = activeAge <= 1;

  const badgeContainer = $('userBadgeContainer');
  badgeContainer.innerHTML = '';
  if (userName || userGender) {
    let badgeText = '';
    if (userName) badgeText += userName;
    if (userGender) {
      if (userName) badgeText += ' · ';
      badgeText += (userGender === 'male' ? '乾' : '坤');
    }
    const badge = document.createElement('span');
    badge.className = 'user-badge';
    badge.textContent = badgeText;
    badgeContainer.append(badge);
  }

  if (calendarType === 'solar') {
    $('dateLabel').textContent = `阳历 ${rawDate} 对应农历：${birth.year} 年 ${birth.isLeapMonth ? '闰' : ''}${birth.month} 月 ${birth.day} 日`;
  } else {
    $('dateLabel').textContent = `阴历：${birth.year} 年 ${birth.month} 月 ${birth.day} 日`;
  }
  
  $('inputPanel').classList.add('hidden');
  $('outputPanel').classList.remove('hidden');
}

$('prevYear').addEventListener('click', () => {
  if (!currentState) return;
  if (currentState.baseAge + currentState.yearOffset > 1) {
    currentState.yearOffset -= 1;
    renderState();
  }
});

$('nextYear').addEventListener('click', () => {
  if (!currentState) return;
  currentState.yearOffset += 1;
  renderState();
});

$('backBtn').addEventListener('click', () => {
  $('outputPanel').classList.add('hidden');
  $('inputPanel').classList.remove('hidden');
});

$('calculate').addEventListener('click',()=>{
 try{
  $('error').style.display='none';
  const calendarType = $('calendar').value;
  if(!calendarType) throw new Error('请选择出生日期类型。');

  const hourVal = $('hour').value;
  if(hourVal === '') throw new Error('请选择出生时间。');

  const rawDate = $('birthDate').value;
  if(!rawDate) throw new Error('请选择出生日期。');
  
  const userName = $('userName').value.trim();
  const userGender = $('userGender').value;

  let birth;
  if (calendarType === 'solar') {
    birth = solarToLunar(rawDate);
  } else {
    const [ly, lm, ld] = rawDate.split('-').map(Number);
    if (ly < 1900 || ly > 2099) throw new Error('支持 1900 至 2099 年之间的日期。');
    const maxDay = lunarMonthDays(ly, lm);
    if (ld > maxDay) throw new Error(`农历 ${ly} 年 ${lm} 月只有 ${maxDay} 天，请调整日期。`);
    birth = { year: ly, month: lm, day: ld, isLeapMonth: false };
  }

  const age = virtualAge(birth.year, birth.month, birth.day);
  if(age<1)throw new Error('计算得到的虚岁小于 1，请检查出生日期。');

  currentState = {
    birth,
    hour: Number(hourVal),
    baseAge: age,
    yearOffset: 0,
    calendarType,
    rawDate,
    userName,
    userGender
  };
  renderState();
 }catch(e){
  $('error').textContent=e.message||'计算失败，请检查输入。';
  $('error').style.display='block';
  $('outputPanel').classList.add('hidden');
  $('inputPanel').classList.remove('hidden');
 }
});
</script>
</body>
</html>
